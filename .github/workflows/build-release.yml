name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK Asset
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/MyIDN-${{ github.ref_name }}.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/MyIDN-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "MyIDN App Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: |
            release-artifacts/MyIDN-${{ github.ref_name }}.apk
            release-artifacts/MyIDN-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 📱 MyIDN App Release ${{ github.ref_name }}
            
            > [!IMPORTANT]
            > 💳 **Informasi Lisensi Berbayar (In-App Activation):**
            > Aplikasi MyIDN merupakan aplikasi berbayar dengan lisensi permanen (*Lifetime License* seumur hidup).
            > - **Harga Lisensi**: **Rp 25.000 (Sekali bayar / Lifetime)**
            > - **Metode Pembayaran**: Scan barcode **QRIS** langsung di halaman aktivasi aplikasi (mendukung GoPay, OVO, DANA, ShopeePay, BCA, Mandiri, BRI, Bank Jago, atau e-wallet/bank apa saja).
            > - **Cara Aktivasi**: Scan QRIS -> Transfer Rp 25.000 (Pas) -> Kirim Kode Perangkat & Bukti Transfer ke WhatsApp Admin -> Dapatkan Serial Key Resmi untuk aktivasi seumur hidup.
            
            Unduh berkas APK siap pakai di bawah ini dan pasang langsung ke perangkat Android Anda.
            
            ### 📥 Download
            * **[MyIDN-${{ github.ref_name }}.apk](https://github.com/allam1768/MyIDN_app/releases/download/${{ github.ref_name }}/MyIDN-${{ github.ref_name }}.apk)**
            * [MyIDN-release.apk](https://github.com/allam1768/MyIDN_app/releases/download/${{ github.ref_name }}/MyIDN-release.apk)
            
            ### 🚀 Panduan Instalasi & Aktivasi
            1. Unduh berkas **MyIDN-${{ github.ref_name }}.apk**.
            2. Buka berkas dan tekan **Install** (Jika muncul notifikasi Play Protect, pilih *More details / Rincian lainnya* -> *Install anyway / Tetap instal*).
            3. Buka aplikasi **MyIDN**.
            4. Di halaman **Aktivasi Lisensi**, scan kode QRIS dan lakukan transfer **Rp 25.000**.
            5. Tekan tombol **Kirim Kode & Bukti Bayar ke WhatsApp** untuk mengirim Kode Perangkat beserta foto bukti transfer ke Admin.
            6. Tempelkan Serial Key yang diterima dari Admin dan tekan **Aktivasi Sekarang**. Aplikasi akan aktif permanen seumur hidup!


