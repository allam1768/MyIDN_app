name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK Asset
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/MyIDN-${{ github.ref_name }}.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/MyIDN-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "MyIDN App Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: |
            release-artifacts/MyIDN-${{ github.ref_name }}.apk
            release-artifacts/MyIDN-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 📱 MyIDN App Release ${{ github.ref_name }}
            
            Unduh berkas APK versi terbaru di bawah ini dan pasang langsung ke perangkat Android Anda.
            
            ### ✨ Apa yang Baru di Versi ${{ github.ref_name }}:
            - 🎓 **Integrasi Dinamis Jadwal Kuliah Reguler:** Menampilkan jadwal perkuliahan semester reguler (Agama Islam, Praktikum UI/UX, dll) 100% dinamis dari server LMS dengan tombol aksi cepat Presensi, Materi, dan Tugas.
            - 🕒 **Carousel Sesi Perkuliahan Mendatang:** Tampilan kartu modern dengan hierarki jam mulai besar (`08:00 WIB`), badge hari pintar (`Hari Ini` / `Besok`), dan chip nomor ruangan lab/kelas yang mencolok.
            - ⏱️ **Live Clock & Status Presensi:** Indikator jam digital realtime sinkron di header dan badge status `HADIR` otomatis setelah absensi.
            - 📅 **Input Tanggal Poin Kebaikan Cerdas:** Formulir laporan poin kebaikan otomatis terisi tanggal hari ini saat dibuka.
            - 🔄 **Penyempurnaan Sinkronisasi Multi-Sumber:** Sinkronisasi multi-sumber cerdas (LMS Dashboard + Sesi Harian Tahfidz + Offline Cache).
            - 🛡️ **Peningkatan Stabilitas Sesi & Keamanan:** Penanganan terminasi session logout otomatis di backend server.
            
            ### 📥 Download
            * **[MyIDN-${{ github.ref_name }}.apk](https://github.com/allam1768/MyIDN_app/releases/download/${{ github.ref_name }}/MyIDN-${{ github.ref_name }}.apk)**
            * [MyIDN-release.apk](https://github.com/allam1768/MyIDN_app/releases/download/${{ github.ref_name }}/MyIDN-release.apk)
            
            ### 🚀 Panduan Instalasi
            1. Unduh berkas **MyIDN-${{ github.ref_name }}.apk**.
            2. Buka berkas dan pilih **Install** (Jika muncul peringatan Play Protect, pilih *Rincian lainnya / More details* -> *Tetap instal / Install anyway*).
            3. Buka aplikasi **MyIDN** dan login dengan akun LMS IDN Anda.


