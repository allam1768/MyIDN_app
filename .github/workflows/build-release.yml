name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release APK Asset
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/MyIDN-${{ github.ref_name }}.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/MyIDN-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "MyIDN App Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: |
            release-artifacts/MyIDN-${{ github.ref_name }}.apk
            release-artifacts/MyIDN-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 📱 MyIDN App Release ${{ github.ref_name }}
            
            Unduh berkas APK versi terbaru di bawah ini dan pasang langsung ke perangkat Android Anda.
            
            ### ✨ Apa yang Baru di Versi ${{ github.ref_name }}:
            - 📅 **Input Tanggal Poin Kebaikan Cerdas:** Formulir laporan poin kebaikan otomatis terisi tanggal hari ini (hari-H) saat dibuka, dengan opsi dialog pemilih tanggal jika ingin melaporkan kegiatan amalan kemarin.
            - 🔄 **Penyempurnaan Jadwal Kelas Pagi:** Sinkronisasi multi-sumber cerdas (LMS Dashboard + Fallback Jadwal Absensi + Offline Cache) agar jadwal selalu tampil akurat.
            - 🚀 **Performa & Akses Lebih Cepat:** Peningkatan kecepatan startup splash screen dan navigasi dashboard tanpa hambatan.
            - 📄 **Optimalisasi Formulir & Tanda Tangan:** Stabilitas pembuatan Surat Izin tidak masuk kelas dan ekspor PDF.
            - 🛡️ **Peningkatan Stabilitas Sesi:** Deteksi token expired dan auto-reconnect yang lebih handal.
            
            ### 📥 Download
            * **[MyIDN-${{ github.ref_name }}.apk](https://github.com/allam1768/MyIDN_app/releases/download/${{ github.ref_name }}/MyIDN-${{ github.ref_name }}.apk)**
            * [MyIDN-release.apk](https://github.com/allam1768/MyIDN_app/releases/download/${{ github.ref_name }}/MyIDN-release.apk)
            
            ### 🚀 Panduan Instalasi
            1. Unduh berkas **MyIDN-${{ github.ref_name }}.apk**.
            2. Buka berkas dan pilih **Install** (Jika muncul peringatan Play Protect, pilih *Rincian lainnya / More details* -> *Tetap instal / Install anyway*).
            3. Buka aplikasi **MyIDN** dan login dengan akun LMS IDN Anda.


